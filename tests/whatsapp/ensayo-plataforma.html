<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ensayo aislado de WhatsApp · AMOR</title>
<style>body{font-family:Arial,sans-serif;background:#fff5f8;color:#593742;max-width:820px;margin:24px auto;padding:20px}main{background:white;border:1px solid #efcbd8;border-radius:18px;padding:24px}h1{color:#9b3159}label{display:block;margin:12px 0}input:not([type=checkbox]){display:block;padding:10px;width:90%}button{padding:12px;margin:6px;border:1px solid #9b3159;border-radius:8px;background:white;color:#9b3159}pre{white-space:pre-wrap;overflow-wrap:anywhere}button:disabled{opacity:.4}</style></head>
<body><main><h1>Ensayo aislado de WhatsApp</h1><p>Chiapas · inscripción ficticia · emisor de pruebas de Meta · destinatario autorizado terminado en 0814.</p><p>La cola general permanece apagada. No se conecta el número oficial de WhatsApp Business.</p>
<form id="login"><label>Correo administrativo<input id="correo" type="email" autocomplete="username" required></label><label>Contraseña<input id="password" type="password" autocomplete="current-password" required></label><button>Iniciar sesión</button></form>
<section id="controles" hidden><label><input id="confirmar" type="checkbox">Confirmo crear y operar solo la inscripción ficticia de este ensayo y enviar una única invitación a mi número autorizado.</label>
<button data-accion="crear">1. Crear inscripción ficticia</button><button data-accion="confirmar">2. Autorizar cortesía y emitir QR</button><button data-accion="procesar">3. Procesar invitación por WhatsApp</button><button data-accion="estado">Consultar estado de entrega</button><button data-accion="cerrar">Cerrar ensayo y revocar QR</button><button id="salir">Cerrar sesión</button></section>
<pre id="resultado" role="status" aria-live="polite"></pre></main>
<script type="module">
import {createClient} from '@supabase/supabase-js';
if(!['localhost','127.0.0.1'].includes(location.hostname))throw Error('Solo se permite el ensayo en localhost');
const db=createClient(import.meta.env.VITE_SUPABASE_URL,import.meta.env.VITE_SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:false,autoRefreshToken:false}});
const result=document.querySelector('#resultado');let ocupado=false;let envioSolicitado=false;
function bloquear(){document.querySelectorAll('[data-accion]').forEach(b=>b.disabled=ocupado||(b.dataset.accion==='procesar'&&envioSolicitado)||(b.dataset.accion!=='estado'&&!document.querySelector('#confirmar').checked));}
document.querySelector('#confirmar').addEventListener('change',bloquear);
document.querySelector('#login').addEventListener('submit',async e=>{e.preventDefault();result.textContent='Verificando sesión...';const r=await db.auth.signInWithPassword({email:document.querySelector('#correo').value.trim(),password:document.querySelector('#password').value});document.querySelector('#password').value='';if(r.error){result.textContent='No fue posible iniciar sesión.';return;}document.querySelector('#login').hidden=true;document.querySelector('#controles').hidden=false;result.textContent='Sesión iniciada. El servidor verificará rol y asignación activa a Chiapas en cada operación.';bloquear();});
document.querySelectorAll('[data-accion]').forEach(button=>button.addEventListener('click',async()=>{if(ocupado)return;if(button.dataset.accion==='procesar')envioSolicitado=true;ocupado=true;bloquear();result.textContent='Procesando...';try{const r=await db.functions.invoke('whatsapp-ensayo-plataforma',{body:{accion:button.dataset.accion,confirmar:document.querySelector('#confirmar').checked}});if(r.error){let detalle={ok:false,error:'No se completó la operación. Consulta el estado antes de repetir.'};try{if(r.error.context instanceof Response)detalle=await r.error.context.json();}catch{}result.textContent=JSON.stringify(detalle,null,2);}else{result.textContent=JSON.stringify(r.data,null,2);}}catch{result.textContent='Resultado incierto. Consulta el estado; no repitas el envío.';}finally{ocupado=false;bloquear();}}));
document.querySelector('#salir').addEventListener('click',async()=>{await db.auth.signOut();location.reload();});
 bloquear();
</script></body></html>
