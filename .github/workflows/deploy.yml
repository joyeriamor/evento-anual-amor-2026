name: Publicar Evento Anual Amor 2026

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Obtener proyecto
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar aplicación
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          VITE_REGISTROS_HABILITADOS: "true"
          VITE_WHATSAPP_PANEL_HABILITADO: ${{ vars.VITE_WHATSAPP_PANEL_HABILITADO || 'false' }}

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Preparar archivos
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Esperar disponibilidad del paquete
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for intento in {1..12}; do
            cantidad=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length')
            if [[ "$cantidad" == "1" ]]; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::GitHub todavía no permite consultar el paquete github-pages."
          exit 1

      - name: Publicar
        id: deployment
        # v4.0.0 consulta artefactos por REST; el listado interno de v4 devuelve cero.
        uses: actions/deploy-pages@f33f41b675f0ab2dc5a6863c9a170fe83af3571e # v4.0.0
